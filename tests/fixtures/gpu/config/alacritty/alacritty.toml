[general]
import = ["~/nonexistent.toml", "themes/gruvbox.toml"]

[font]
size = 12.0

[font.normal]
family = "Fira Code"
style = "Regular"

[cursor]
style = { shape = "Beam", blinking = "On" }

[scrolling]
history = 20000

[window.padding]
x = 5
y = 5

[terminal.shell]
program = "/bin/bash"
args = ["--login"]

[colors.primary]
background = "0x1d2021"
