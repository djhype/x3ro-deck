name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
            container: archlinux:latest
            preset: linux
          - name: macos
            runner: macos-latest
            container: ''
            preset: macos
          - name: windows
            runner: windows-latest
            container: ''
            preset: windows
    steps:
      # Without git, actions/checkout downloads a tarball with no .git, and
      # check-format.sh lists files with git ls-files.
      - name: Install git
        if: matrix.name == 'linux'
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4

      - name: Mark the checkout safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        if: matrix.name == 'linux'
        run: scripts/ci-linux-deps.sh

      - name: Install dependencies (macOS)
        if: matrix.name == 'macos'
        run: scripts/ci-macos-deps.sh

      # MSVC's environment, and Qt from the official installer; libvterm is
      # built from its release tarball (X3RO_DECK_BUNDLED_VTERM falls back to it).
      - name: MSVC environment
        if: matrix.name == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt (Windows)
        if: matrix.name == 'windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Check formatting
        if: matrix.name == 'linux'
        run: scripts/check-format.sh

      - name: Check SPDX headers
        if: matrix.name == 'linux'
        run: scripts/check-spdx.sh

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DX3RO_DECK_WERROR=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Windows still runs the suites for the log only (PE-174): ctest showed
      # no output for its failures, so the next step reruns them into files.
      - name: Test
        id: test
        continue-on-error: ${{ matrix.name == 'windows' }}
        env:
          QT_FORCE_STDERR_LOGGING: '1'
        run: ctest --test-dir build --output-on-failure --no-tests=ignore

      # Each failed suite once more, run directly with QtTest writing its log
      # to a file, which also catches output lost on the way to ctest.
      - name: Failed test logs
        if: always() && steps.test.outcome == 'failure'
        shell: bash
        env:
          QT_FORCE_STDERR_LOGGING: '1'
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          mkdir -p test-logs
          while IFS=: read -r _ name; do
            name=${name%$'\r'}
            exe=$(find build -type f \( -name "tst_${name%-daemon}" -o -name "tst_${name%-daemon}.exe" \) | head -n 1)
            echo "::group::$name ($exe)"
            code=0
            "$exe" -o "test-logs/$name.txt,txt" > "test-logs/$name.out" 2>&1 || code=$?
            echo "exit code: $code"
            cat "test-logs/$name.txt" "test-logs/$name.out" 2>/dev/null || true
            echo "::endgroup::"
          done < build/Testing/Temporary/LastTestsFailed.log

      - name: Upload failed test logs
        if: always() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.name }}
          path: test-logs/

      - name: Smoke test (Windows)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          # Qt's config location on Windows is %LOCALAPPDATA%.
          mkdir -p "$LOCALAPPDATA/x3ro-deck"
          printf '{"autostartAgents": false, "checkouts": [{"name": "deck", "path": "%s"}]}' "$(cygpath -m "$GITHUB_WORKSPACE")" > "$LOCALAPPDATA/x3ro-deck/config.json"
          QT_QPA_PLATFORM=offscreen QT_FORCE_STDERR_LOGGING=1 ./build/x3ro-deck.exe --tab agents --select 0 --screenshot smoke-windows.png 8000 2>&1 | tee smoke.log
          test -s smoke-windows.png
          ! grep -E "qrc:/qml/.*(Error|error|TypeError|ReferenceError)" smoke.log

      - name: Smoke test (macOS)
        if: matrix.name == 'macos'
        run: |
          # Qt's config location on macOS is ~/Library/Preferences.
          mkdir -p "$HOME/Library/Preferences/x3ro-deck"
          printf '{"autostartAgents": false, "checkouts": [{"name": "deck", "path": "%s"}]}' "$GITHUB_WORKSPACE" > "$HOME/Library/Preferences/x3ro-deck/config.json"
          TMUX_TMPDIR="$RUNNER_TEMP" X3RO_DECK_SOCKET="$RUNNER_TEMP/deck.sock" \
            X3RO_DECK_INSTANCE_SOCKET="$RUNNER_TEMP/instance.sock" QT_QPA_PLATFORM=offscreen QT_FORCE_STDERR_LOGGING=1 \
            build/x3ro-deck.app/Contents/MacOS/x3ro-deck --tab agents --select 0 --screenshot smoke-macos.png 8000 2>&1 | tee smoke.log
          test -s smoke-macos.png
          ! grep -E "qrc:/qml/.*(Error|error|TypeError|ReferenceError)" smoke.log

      - name: Smoke test
        if: matrix.name == 'linux'
        run: scripts/smoke-test.sh build/x3ro-deck smoke-${{ matrix.name }}.png

      # README images: invented checkouts and states only (--demo).
      - name: Demo screenshot
        if: matrix.name == 'linux'
        run: |
          XDG_RUNTIME_DIR=$(mktemp -d)
          export XDG_RUNTIME_DIR QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software
          chmod 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- build/x3ro-deck --demo --tab agents --select 1 --screenshot demo-agents.png 6000
          dbus-run-session -- build/x3ro-deck --demo --tab docker --select 0 --screenshot demo-docker.png 6000
          test -s demo-agents.png && test -s demo-docker.png

      - name: Upload demo screenshots
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: demo-screenshots
          path: demo-*.png

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-${{ matrix.name }}
          path: smoke-${{ matrix.name }}.png
          if-no-files-found: warn

  # Guards the Qt 6.4 floor with Ubuntu 24.04's distro Qt and tmux 3.4.
  linux-qt64:
    name: linux (Ubuntu 24.04, Qt 6.4)
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential cmake ninja-build git tmux ca-certificates libgl-dev pkg-config libvterm-dev \
            libxcb1-dev dbus fonts-dejavu-core \
            qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtqml-workerscript

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja -DX3RO_DECK_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Smoke test
        run: scripts/smoke-test.sh build/x3ro-deck smoke-qt64.png

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-qt64
          path: smoke-qt64.png
          if-no-files-found: warn
