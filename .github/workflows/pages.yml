#
# Serves install.sh and install.ps1 at https://deck.x3ro.life/ (GitHub Pages,
# custom domain set in the repository's Pages settings). The scripts install
# the latest release on their own, so they only need publishing when they
# change, not on every release.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - packaging/install.sh
      - packaging/install.ps1
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir site
          cp packaging/install.sh packaging/install.ps1 site/
          cat > site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>x3ro deck</title>
          <meta http-equiv="refresh" content="0; url=https://github.com/djhype/x3ro-deck#install">
          <p><a href="https://github.com/djhype/x3ro-deck#install">x3ro deck on GitHub</a></p>
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
